name: Build Flutter Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ১. রিপোজিটরি চেকআউট করা
      - name: Checkout Code
        uses: actions/checkout@v4

      # ২. জাবা SDK (JDK 17) সেটআপ করা
      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ৩. ফ্লাটার SDK সেটআপ করা
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # ৪. main.dart ফাইলের ডট-শর্টহ্যান্ড (.fromSeed, .center) সিনট্যাক্স অটো-ফিক্স করা
      - name: Fix main.dart Dot Shorthand Syntax Errors
        run: |
          if [ -f lib/main.dart ]; then
            sed -i 's/colorScheme: \.fromSeed/colorScheme: ColorScheme.fromSeed/g' lib/main.dart
            sed -i 's/mainAxisAlignment: \.center/mainAxisAlignment: MainAxisAlignment.center/g' lib/main.dart
            sed -i 's/crossAxisAlignment: \.center/crossAxisAlignment: CrossAxisAlignment.center/g' lib/main.dart
          fi

      # ৫. অ্যান্ড্রয়েড প্ল্যাটফর্ম স্ট্রাকচার রি-ক্রিয়েট করা
      - name: Re-create Android Platform Structure
        run: |
          flutter create . --platforms=android --org com.example.media_vault

      # ৬. ফিঙ্গারপ্রিন্ট বায়োমেট্রিক সাপোর্টসহ MainActivity.kt ও AndroidManifest.xml জেনারেট করা
      - name: Auto-generate Native Android Files
        run: |
          # 1. Ensure Directory Structure
          mkdir -p android/app/src/main/kotlin/com/example/media_vault
          mkdir -p android/app/src/main

          # 2. Generate MainActivity.kt (Extending FlutterFragmentActivity)
          cat << 'EOF' > android/app/src/main/kotlin/com/example/media_vault/MainActivity.kt
          package com.example.media_vault

          import io.flutter.embedding.android.FlutterFragmentActivity

          class MainActivity: FlutterFragmentActivity() {
          }
          EOF

          # 3. Generate AndroidManifest.xml with Permissions
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.media_vault">

              <uses-permission android:permission="android.permission.USE_BIOMETRIC"/>
              <uses-permission android:permission="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:permission="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:permission="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:permission="android.permission.WRITE_EXTERNAL_STORAGE"/>

              <application
                  android:label="AH Media Locker"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      # ৭. ফ্লাটার প্যাকেজ ইনস্টল করা
      - name: Install Dependencies
        run: flutter pub get

      # ৮. Release APK তৈরি করা
      - name: Build Release APK
        run: flutter build apk --release

      # ৯. তৈরি হওয়া APK গিটহাব অ্যাকশন আর্টফ্যাক্ট হিসেবে আপলোড করা
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-media-vault-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
